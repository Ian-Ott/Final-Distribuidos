apiVersion: apps/v1
kind: Deployment

metadata:
  name: locust
  namespace: observability

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: locust

  template:
    metadata:
      labels:
        app: locust

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      nodeSelector:
        pool: monitoring

      tolerations:
      - key: monitoring
        operator: Equal
        value: "true"
        effect: NoSchedule

      containers:
      - name: locust
        securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL

        image: us-central1-docker.pkg.dev/tp-final-distribuidos/sdypp/locust:latest
        imagePullPolicy: Always

        args:
          - -f
          - /home/locust/locustfile.py
          - --host=http://blockchain-nct.sdypp.svc.cluster.local
          - --web-host=0.0.0.0

        ports:
        - containerPort: 8089

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi