name: "Pipeline 6 - Performance Testing"

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "locust/**"
      - "k8s/gke/observability/locust-*.yaml"
      - ".github/workflows/pipeline-6-performance.yml"

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================================
  # 1. SEGURIDAD
  # ==========================================================================

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml


  # ==========================================================================
  # 2. BUILD + PUSH
  # ==========================================================================

  build:
    name: Build and Push Locust
    needs:
      - gitleaks

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            us-central1-docker.pkg.dev \
            --quiet

      - name: Build Locust image
        run: |
          IMAGE="us-central1-docker.pkg.dev/tp-final-distribuidos/sdypp/locust:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE" \
            ./locust

      - name: Push Locust image
        run: |
          IMAGE="us-central1-docker.pkg.dev/tp-final-distribuidos/sdypp/locust:${GITHUB_SHA}"

          docker push "$IMAGE"


  # ==========================================================================
  # 3. DEPLOY
  # ==========================================================================

  deploy:
    name: Deploy Locust
    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Ensure namespace
        run: |
          kubectl apply \
            -f k8s/gke/observability/namespace.yaml

      - name: Apply Locust ConfigMap
        run: |
          kubectl apply \
            -f k8s/gke/observability/locust-config.yaml

      - name: Apply Locust deployment
        run: |
          kubectl apply \
            -f k8s/gke/observability/locust-deployment.yaml

      - name: Apply Locust service
        run: |
          kubectl apply \
            -f k8s/gke/observability/locust-service.yaml

      - name: Update Locust image
        run: |
          IMAGE="us-central1-docker.pkg.dev/tp-final-distribuidos/sdypp/locust:${GITHUB_SHA}"

          kubectl -n observability \
            set image deployment/locust \
            locust="$IMAGE"

      - name: Wait for Locust
        run: |
          kubectl -n observability \
            rollout status deployment/locust \
            --timeout=300s


    # ==========================================================================
  # 4. PREFLIGHT
  #
  # Verifica que el sistema esté disponible antes de ejecutar los escenarios
  # de Locust.
  #
  # Cluster principal:
  #   - Locust
  #   - NCT
  #   - TrP
  #
  # Cluster profesor:
  #   - worker CPU
  #   - worker GPU
  #
  # IMPORTANTE:
  # Este job NO mide rendimiento.
  # Solo comprueba que la infraestructura necesaria esté disponible.
  # ==========================================================================

  preflight:
    name: Validate distributed system before performance tests

    needs:
      - deploy

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================================
      # AUTENTICACIÓN GCP
      # ======================================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}


      # ======================================================================
      # CLUSTER PRINCIPAL
      # ======================================================================

      - name: Get main GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a


      # ======================================================================
      # 1. LOCTUST
      # ======================================================================

      - name: Validate Locust
        run: |
          kubectl -n observability \
            wait \
            --for=condition=Ready \
            pod \
            -l app=locust \
            --timeout=120s


      # ======================================================================
      # 2. NCT
      # ======================================================================

      - name: Validate NCT
        run: |
          kubectl -n sdypp \
            wait \
            --for=condition=Ready \
            pod \
            -l app=blockchain-nct \
            --timeout=120s


      # ======================================================================
      # 3. TRP
      # ======================================================================

      - name: Validate TrP
        run: |
          kubectl -n sdypp \
            wait \
            --for=condition=Ready \
            pod \
            -l app=blockchain-trp \
            --timeout=120s


      # ======================================================================
      # 4. VALIDAR SERVICIOS DE NCT
      # ======================================================================

      - name: Validate NCT service
        run: |
          kubectl -n sdypp \
            get service blockchain-nct


      # ======================================================================
      # 5. VALIDAR HTTP DESDE LOCTUST HACIA NCT
      #
      # Esto es importante porque comprobar que el pod está Ready no demuestra
      # que Locust pueda comunicarse realmente con NCT.
      # ======================================================================

      - name: Validate NCT HTTP from Locust
        run: |

          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            python -c '
          import urllib.request

          url = "http://blockchain-nct.sdypp.svc.cluster.local/healthz"

          with urllib.request.urlopen(url, timeout=10) as response:
              if response.status != 200:
                  raise RuntimeError(
                      f"NCT healthcheck returned HTTP {response.status}"
                  )

          print("NCT HTTP OK")
          '


      # ======================================================================
      # 6. CAMBIAR AL CLUSTER DEL PROFESOR
      #
      # Desde acá kubectl deja de apuntar a sdypp-cluster.
      #
      # KUBE_CONFIG_PROFESOR es exactamente el mecanismo que ya utilizás
      # en Pipeline 4.
      # ======================================================================

      - name: Configure Profesor cluster
        run: |
          mkdir -p ~/.kube

          echo "${{ secrets.KUBE_CONFIG_PROFESOR }}" \
            | base64 -d > ~/.kube/config

          kubectl config current-context


      # ======================================================================
      # 7. VALIDAR WORKERS CPU
      # ======================================================================

      - name: Validate CPU workers
        run: |

          kubectl get pods \
            -l app=blockchain-worker \
            --field-selector=status.phase=Running

          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app=blockchain-worker \
            --timeout=120s


      # ======================================================================
      # 8. VALIDAR GPU SERVER
      # ======================================================================

      - name: Validate GPU server
        run: |

          kubectl get pods \
            -l app=blockchain-gpu-server \
            --field-selector=status.phase=Running

          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app=blockchain-gpu-server \
            --timeout=120s


      # ======================================================================
      # 9. MOSTRAR ESTADO FINAL DEL CLUSTER PROFESOR
      # ======================================================================

      - name: Show worker infrastructure
        run: |

          echo "=== Workers ==="

          kubectl get pods \
            -l app=blockchain-worker \
            -o wide

          echo ""
          echo "=== GPU Server ==="

          kubectl get pods \
            -l app=blockchain-gpu-server \
            -o wide


  # ==========================================================================
  # 5. BASELINE
  # ==========================================================================

  performance-baseline:

    name: Performance - Baseline

    needs:
      - preflight

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Execute baseline
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            env \
              LOCUST_SCENARIO=baseline \
              locust \
                -f /home/locust/locustfile.py \
                --headless \
                --host=http://blockchain-nct.sdypp.svc.cluster.local:8000 \
                --only-summary \
                --csv=/tmp/baseline

          kubectl -n observability logs "$POD" --tail=300

      - name: Collect results
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl cp \
            observability/$POD:/tmp/baseline_stats.csv \
            baseline_stats.csv

      - uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: baseline_stats.csv


  # ==========================================================================
  # 6. LOAD
  # ==========================================================================

  performance-load:

    name: Performance - Load

    needs:
      - performance-baseline

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Execute load
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            env LOCUST_SCENARIO=load \
            locust \
              -f /home/locust/locustfile.py \
              --headless \
              --host=http://blockchain-nct.sdypp.svc.cluster.local:8000 \
              --only-summary


  # ==========================================================================
  # 7. STRESS
  # ==========================================================================

  performance-stress:

    name: Performance - Stress

    needs:
      - performance-load

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Execute stress
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            env LOCUST_SCENARIO=stress \
            locust \
              -f /home/locust/locustfile.py \
              --headless \
              --host=http://blockchain-nct.sdypp.svc.cluster.local:8000 \
              --only-summary


  # ==========================================================================
  # 8. SPIKE
  # ==========================================================================

  performance-spike:

    name: Performance - Spike

    needs:
      - performance-stress

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Execute spike
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            env LOCUST_SCENARIO=spike \
            locust \
              -f /home/locust/locustfile.py \
              --headless \
              --host=http://blockchain-nct.sdypp.svc.cluster.local:8000 \
              --only-summary


  # ==========================================================================
  # 9. SOAK
  # ==========================================================================

  performance-soak:

    name: Performance - Soak

    needs:
      - performance-spike

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Execute soak
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            env LOCUST_SCENARIO=soak \
            locust \
              -f /home/locust/locustfile.py \
              --headless \
              --host=http://blockchain-nct.sdypp.svc.cluster.local:8000 \
              --only-summary


  # ==========================================================================
  # 10. SYSTEM MATRIX
  # ==========================================================================

  system-matrix:

    name: System Matrix

    needs:
      - performance-soak

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: bulk-1
            bulk: 1
            difficulty: 1
            fragmentation: 1
            workers: 4

          - name: bulk-100
            bulk: 100
            difficulty: 2
            fragmentation: 10
            workers: 4

          - name: bulk-1000
            bulk: 1000
            difficulty: 4
            fragmentation: 25
            workers: 4

          - name: bulk-10000
            bulk: 10000
            difficulty: 6
            fragmentation: 50
            workers: 4

          - name: bulk-100000
            bulk: 100000
            difficulty: 8
            fragmentation: 50
            workers: 4

          - name: scale-2m
            bulk: 1000
            difficulty: 4
            fragmentation: 25
            workers: 8

          - name: scale-2m-large
            bulk: 10000
            difficulty: 6
            fragmentation: 50
            workers: 8

    steps:

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sdypp-cluster
          location: us-central1-a

      - name: Scale workers
        run: |
          kubectl -n sdypp scale deployment/blockchain-worker \
            --replicas=${{ matrix.workers }}

          kubectl -n sdypp rollout status \
            deployment/blockchain-worker \
            --timeout=300s

      - name: Execute system scenario
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            env \
              LOCUST_SCENARIO=system \
              LOCUST_BULK=${{ matrix.bulk }} \
              LOCUST_DIFFICULTY=${{ matrix.difficulty }} \
              LOCUST_FRAGMENTATION=${{ matrix.fragmentation }} \
              locust \
                -f /home/locust/locustfile.py \
                --headless \
                --host=http://blockchain-nct.sdypp.svc.cluster.local:8000 \
                --only-summary

      - name: Validate blockchain
        run: |
          POD=$(kubectl -n observability \
            get pods \
            -l app=locust \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl -n observability exec "$POD" -- \
            python - <<'PY'
          import urllib.request
          import json

          url = "http://blockchain-nct.sdypp.svc.cluster.local:8000/validate"

          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.loads(response.read())

          print(data)

          if not data.get("valid"):
              raise SystemExit("Blockchain validation failed")
          PY

      - name: Restore M workers
        if: always()
        run: |
          kubectl -n sdypp scale deployment/blockchain-worker \
            --replicas=4